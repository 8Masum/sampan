name: sampan
description: >-
  Sampan (সাম্পান) — Local-First, Zero-Cloud P2P Mesh for Travel & Co-Presence.
  Communicate over BLE and Local Wi-Fi Hotspots (SoftAP) with directional
  compass radar, virtual leash, caravan chat, SOS digital megaphone, and
  zero-install browser hub.
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shelf: ^1.4.1
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  uses-material-design: true
  assets:
    - Logo/Sampan.png
