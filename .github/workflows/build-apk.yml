name: Build and Release Sampan Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release tag name (e.g. v1.0.0). Defaults to pubspec.yaml version if empty.'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for protocol & SoftAP verification suite)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run protocol, geo-math & SoftAP verification suite
        run: node scripts/verify-all.mjs

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android & iOS platform runners are scaffolded
        run: |
          mkdir -p /tmp/sampan-native
          cp android/app/src/main/AndroidManifest.xml /tmp/sampan-native/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/themasum/sampan/MainActivity.kt /tmp/sampan-native/MainActivity.kt
          rm -rf android ios
          flutter create --org com.themasum --project-name sampan --platforms android,ios .
          rm -f test/widget_test.dart
          git checkout -- lib test pubspec.yaml analysis_options.yaml README.md
          mkdir -p android/app/src/main/kotlin/com/themasum/sampan
          cp /tmp/sampan-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/sampan-native/MainActivity.kt android/app/src/main/kotlin/com/themasum/sampan/MainActivity.kt

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Dart static analysis
        run: flutter analyze

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build Standalone Release APK
        run: flutter build apk --release

      - name: Prepare APK Release Assets
        id: prepare_assets
        run: |
          mkdir -p release-assets
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"

          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          PKG_VERSION="v${RAW_VER:-1.0.0}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ inputs.tag_name }}"
          else
            RELEASE_TAG="$PKG_VERSION"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$RELEASE_TAG"
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cp "$APK_FILE" release-assets/Sampan.apk
          cp "$APK_FILE" "release-assets/Sampan-${RELEASE_TAG}.apk"

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

          echo "Prepared release assets:"
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Upload Standalone Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sampan-Release-APK
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sampan (সাম্পান) ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### ⛵ Sampan (সাম্পান) ${{ env.RELEASE_TAG }}
            *Local-First, Zero-Cloud P2P Mesh for Travel & Co-Presence*

            - **Direct APK Download**: Tap [`Sampan.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/Sampan.apk) (or [`Sampan-${{ env.RELEASE_TAG }}.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/Sampan-${{ env.RELEASE_TAG }}.apk)) below to install on your Android device.
            - **Core Capabilities**:
              1. **3D Compass Homing Dial & Virtual Leash**: Offline GNSS + Magnetometer bearing needle with `-85 dBm / 45s` Virtual Leash alarm.
              2. **Offline Caravan Chat & Digital Megaphone (SOS)**: ChaCha20-Poly1305 encrypted group/DM rings, Cox's Bazar Landmark Pings, and high-priority SOS broadcast.
              3. **Zero-Install SoftAP Hotspot Hub**: Embedded HTTP/SSE portal on port `8080` + 25 MB/s local P2P APK transfer (`/download/sampan.apk`).
            - **Verification**: Check `SHA256SUMS.txt` to verify APK integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
