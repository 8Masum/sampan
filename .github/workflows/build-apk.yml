name: Build and Release Sampan Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release tag name (e.g. v1.0.0). Defaults to pubspec.yaml version if empty.'
        required: false
        type: string
        default: ''
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for protocol & SoftAP verification suite)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run protocol, geo-math & SoftAP verification suite
        run: node scripts/verify-all.mjs

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android & iOS platform runners are scaffolded
        run: |
          mkdir -p /tmp/sampan-native
          cp android/app/src/main/AndroidManifest.xml /tmp/sampan-native/AndroidManifest.xml
          cp android/app/src/main/kotlin/com/themasum/sampan/MainActivity.kt /tmp/sampan-native/MainActivity.kt
          rm -rf android ios
          flutter create --org com.themasum --project-name sampan --platforms android,ios .
          rm -f test/widget_test.dart
          git checkout -- lib test pubspec.yaml analysis_options.yaml README.md Logo
          mkdir -p android/app/src/main/kotlin/com/themasum/sampan
          cp /tmp/sampan-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/sampan-native/MainActivity.kt android/app/src/main/kotlin/com/themasum/sampan/MainActivity.kt
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [[ "$dir" != *anydpi* ]]; then
              cp Logo/Sampan.png "$dir/ic_launcher.png"
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi*

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Dart static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Configure Persistent APK Signing Keystore (for Seamless OTA Auto-Updates)
        env:
          SAMPAN_KEYSTORE_BASE64: ${{ secrets.SAMPAN_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          if [ -n "$SAMPAN_KEYSTORE_BASE64" ]; then
            echo "Restoring persistent APK signing keystore from SAMPAN_KEYSTORE_BASE64..."
            echo "$SAMPAN_KEYSTORE_BASE64" | base64 --decode > /tmp/sampan-input.keystore
            keytool -importkeystore \
              -srckeystore /tmp/sampan-input.keystore \
              -srcstorepass android \
              -destkeystore "$HOME/.android/debug.keystore" \
              -deststorepass android \
              -destkeypass android \
              -alias androiddebugkey \
              -noprompt || cp /tmp/sampan-input.keystore "$HOME/.android/debug.keystore"
            rm -f /tmp/sampan-input.keystore
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Verified signing keystore fingerprint:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "Alias|SHA256"

      - name: Resolve Release Version & Monotonic Build Number
        id: version_meta
        run: |
          RAW_VER_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          RAW_VER_NAME=$(echo "$RAW_VER_LINE" | cut -d'+' -f1)
          PKG_VERSION="v${RAW_VER_NAME:-1.0.0}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ inputs.tag_name }}"
          else
            RELEASE_TAG="$PKG_VERSION"
          fi

          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$RELEASE_TAG"
          fi

          # Extract clean semantic build-name (e.g. v1.0.1 -> 1.0.1) so the compiled
          # APK's packageInfo.versionName matches the GitHub Release tag.
          BUILD_NAME="${RELEASE_TAG#v}"
          BUILD_NAME="${BUILD_NAME%%+*}"
          if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            BUILD_NAME="${RAW_VER_NAME:-1.0.0}"
          fi

          # Compute a monotonically increasing integer versionCode across versions
          # and CI runs so Android PackageManager always permits in-place upgrades.
          IFS='.' read -r V_MAJ V_MIN V_PAT _ <<< "${BUILD_NAME%%-*}"
          V_MAJ=${V_MAJ//[^0-9]/}; V_MAJ=${V_MAJ:-1}
          V_MIN=${V_MIN//[^0-9]/}; V_MIN=${V_MIN:-0}
          V_PAT=${V_PAT//[^0-9]/}; V_PAT=${V_PAT:-0}
          SEMVER_CODE=$(( V_MAJ * 10000 + V_MIN * 100 + V_PAT ))
          RUN_OFFSET=$(( ${GITHUB_RUN_NUMBER:-1} % 1000 ))
          BUILD_NUMBER=$(( SEMVER_CODE * 1000 + RUN_OFFSET ))

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Resolved RELEASE_TAG=$RELEASE_TAG, BUILD_NAME=$BUILD_NAME, BUILD_NUMBER=$BUILD_NUMBER"

      - name: Build Standalone Release APK
        run: flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Prepare APK Release Assets
        id: prepare_assets
        run: |
          mkdir -p release-assets
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          echo "APK signing certificate:"
          keytool -printcert -jarfile "$APK_FILE" | grep -E "Owner|SHA256" || true

          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cp "$APK_FILE" release-assets/Sampan.apk
          cp "$APK_FILE" "release-assets/Sampan-${RELEASE_TAG}.apk"

          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

          echo "Prepared release assets:"
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Upload Standalone Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sampan-Release-APK
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sampan (সাম্পান) ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### ⛵ Sampan (সাম্পান) ${{ env.RELEASE_TAG }}
            *Local-First, Zero-Cloud P2P Mesh for Travel & Co-Presence*

            - **Direct APK Download**: Tap [`Sampan.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/Sampan.apk) (or [`Sampan-${{ env.RELEASE_TAG }}.apk`](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/Sampan-${{ env.RELEASE_TAG }}.apk)) below to install on your Android device.
            - **Core Capabilities**:
              1. **3D Compass Homing Dial & Virtual Leash**: Offline GNSS + Magnetometer bearing needle with `-85 dBm / 45s` Virtual Leash alarm.
              2. **Offline Caravan Chat & Digital Megaphone (SOS)**: ChaCha20-Poly1305 encrypted group/DM rings, Cox's Bazar Landmark Pings, and high-priority SOS broadcast.
              3. **Zero-Install SoftAP Hotspot Hub**: Embedded HTTP/SSE portal on port `8080` + 25 MB/s local P2P APK transfer (`/download/sampan.apk`).
            - **Verification**: Check `SHA256SUMS.txt` to verify APK integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
